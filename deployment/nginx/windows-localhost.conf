# Copy the contents of this file inside the `http { ... }` block in nginx.conf,
# or include it from that block.
#
# This expects:
# - the production frontend server on 127.0.0.1:3001
# - FastAPI on 127.0.0.1:8000

server {
    listen 80;
    server_name localhost;

    client_max_body_size 1m;

    location = /api/public-menu {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        valid_referers localhost 127.0.0.1;
        if ($invalid_referer) {
            return 403;
        }

        proxy_pass https://omd.a2hosted.com/;
        proxy_ssl_server_name on;
        proxy_ssl_name omd.a2hosted.com;
        proxy_set_header Host omd.a2hosted.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /webapp/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
